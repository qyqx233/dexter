name: Sync Upstream

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ipatch branch
        uses: actions/checkout@v4
        with:
          ref: ipatch
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/virattt/dexter.git
          git fetch upstream --no-tags

      - name: Merge upstream/main into ipatch
        run: |
          git merge upstream/main --no-edit || {
            echo "::error::Merge conflict detected. Please resolve manually."
            exit 1
          }

      - name: Push to origin/ipatch
        run: |
          git push origin ipatch
